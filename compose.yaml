services:
  viewer:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8080}
      CAMERA_HOSTS: ${CAMERA_HOSTS:?Set CAMERA_HOSTS in .env}
    volumes:
      - cameras:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  cameras:
